<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VITA</title>
  <meta name="description" content="Vita's protein, movement and vitamin tracker, with gentle iPhone Calendar reminders.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VITA">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#today" aria-label="VITA home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="8" y="13" width="6" height="14" rx="3" transform="skewX(-14)" fill="var(--protein)"/>
        <rect x="17" y="9" width="6" height="18" rx="3" transform="skewX(-14)" fill="var(--move)"/>
        <rect x="26" y="5" width="6" height="22" rx="3" transform="skewX(-14)" fill="var(--vit)"/>
      </svg>
      <span>VITA</span>
    </a>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-7.5-10.4A4.4 4.4 0 0 1 12 8a4.4 4.4 0 0 1 7.5 2.6C19.5 16.4 12 21 12 21z"/></svg>
      <span>Today</span>
    </a>
    <a href="#protein" data-tab="protein" class="t-protein">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.6 0 6.5 5.6 6.5 10.1a6.5 6.5 0 0 1-13 0C5.5 8.6 8.4 3 12 3z"/></svg>
      <span>Protein</span>
    </a>
    <a href="#move" data-tab="move" class="t-move">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 3c.6 3.2 4.5 5.4 4.5 10a5 5 0 0 1-10 0c0-2.1 1-3.6 2.2-4.8.2 1.7 1 2.8 2.1 3.3-.4-3.1.1-5.8 1.2-8.5z"/></svg>
      <span>Move</span>
    </a>
    <a href="#vitamins" data-tab="vitamins" class="t-vit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-45 12 12)"/><path d="m9.5 9.5 5 5"/></svg>
      <span>Vitamins</span>
    </a>
    <a href="#me" data-tab="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Me</span>
    </a>
  </nav>

  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="flash" role="dialog" aria-modal="true" aria-live="polite" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <input type="file" id="pick-photo" accept="image/*" hidden>

  <script src="ics.js"></script>
  <script src="app.js"></script>
</body>
</html>
